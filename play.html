<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Loading…</title>
<meta name="theme-color" content="#0e0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0e0f13; color: #eceef4; overflow: hidden;
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; }
  .center { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
  .center img { width: 96px; height: 96px; border-radius: 22px; }
  .err { color: #ef6a6a; max-width: 420px; }
  .bar { width: min(260px, 70vw); height: 6px; border-radius: 3px; background: #1f222d; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: #e8a93a; transition: width .15s; }
  .sub { color: #8b90a3; font-size: 13px; }
  .btn { appearance: none; border: 1px solid #2a2e3b; background: #1f222d; color: inherit; border-radius: 12px; height: 44px; padding: 0 18px; font: inherit; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
  .btn.primary { background: #e8a93a; color: #1a1305; border: 0; font-weight: 600; }
  input { height: 44px; border-radius: 12px; border: 1px solid #2a2e3b; background: #0e0f13; color: #eceef4; padding: 0 12px; font: 15px ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<div class="center" id="status"><div>Loading…</div></div>

<script type="module">
import { loadGames, getMeta, syncGame, registerSW, applyGameMeta, gameStartUrl, getToken, setToken, fmtBytes } from './lib.js';

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const id = params.get('game');
let game;
// An installed app is launched with the token in its start URL (see install.html): keep it, then remove it from the address.
if (params.get('k')) {
  setToken(params.get('k'));
  params.delete('k');
  try { history.replaceState(null, '', location.pathname + '?' + params); } catch {}
}

function view(msg, { err = false, progress = null, sub = '' } = {}) {
  const s = $('status'); s.innerHTML = '';
  if (game && game.icon) { const i = document.createElement('img'); i.src = game.icon; s.appendChild(i); }
  const d = document.createElement('div'); if (err) d.className = 'err'; d.textContent = msg; s.appendChild(d);
  if (progress !== null) {
    const b = document.createElement('div'); b.className = 'bar'; const f = document.createElement('i'); f.style.width = Math.round(progress * 100) + '%'; b.appendChild(f); s.appendChild(b);
  }
  if (sub) { const p = document.createElement('div'); p.className = 'sub'; p.textContent = sub; s.appendChild(p); }
  return s;
}

function fail(msg, askToken) {
  const s = view(msg, { err: true });
  if (askToken) {
    // An installed home-screen app has its own storage (separate from the launcher / Safari), so ask for the token here.
    const inp = document.createElement('input');
    inp.type = 'password'; inp.placeholder = 'GitHub access token'; inp.autocomplete = 'off'; inp.spellcheck = false;
    inp.setAttribute('autocapitalize', 'off'); inp.value = getToken(); inp.style.width = 'min(360px,100%)';
    const go = document.createElement('button'); go.className = 'btn primary'; go.textContent = 'Save token & download';
    go.onclick = () => { setToken(inp.value); location.reload(); };
    s.append(inp, go);
  } else {
    const retry = document.createElement('button'); retry.className = 'btn primary'; retry.textContent = 'Retry'; retry.onclick = () => location.reload();
    s.appendChild(retry);
  }
  const home = document.createElement('a'); home.className = 'btn'; home.href = './'; home.textContent = 'All games'; s.appendChild(home);
}

(async function main() {
  if (!id) return fail('No game selected.');
  try { game = (await loadGames()).find(g => g.id === id); } catch (e) { return fail(e.message); }
  if (!game) return fail('Unknown game "' + id + '". Is it listed in games.json?');
  applyGameMeta(game);

  await registerSW(); // the worker serves the game's files, so it must be running before we navigate there
  if (!(await getMeta(game.id))) {
    view('Downloading ' + (game.title || game.id) + '…', { progress: 0 });
    try {
      await syncGame(game, {
        onProgress: (done, total) => view('Downloading ' + (game.title || game.id) + '…', { progress: total ? done / total : 1, sub: done + ' / ' + total + ' files' }),
      });
    } catch (e) { return fail(e.message, !!e.status); }
  } else if (navigator.onLine) {
    // Already downloaded: quickly look for a newer version. A slow or missing connection never blocks launching.
    view('Checking for updates…');
    try {
      await syncGame(game, {
        checkTimeoutMs: 2500,
        onProgress: (done, total) => view('Updating ' + (game.title || game.id) + '…', { progress: total ? done / total : 1, sub: done + ' / ' + total + ' files' }),
      });
    } catch { /* keep playing the version we have */ }
  }
  location.replace(gameStartUrl(game));
})();
</script>
</body>
</html>
