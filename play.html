<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Loading…</title>
<meta name="theme-color" content="#0e0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { --safe-t: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0e0f13; color: #eceef4; overflow: hidden; overscroll-behavior: none;
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
  .center { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
  .center img { width: 96px; height: 96px; border-radius: 22px; }
  .err { color: #ef6a6a; max-width: 420px; }
  .btn { appearance: none; border: 1px solid #2a2e3b; background: #1f222d; color: inherit; border-radius: 12px; height: 44px; padding: 0 18px; font: inherit; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
  .btn.primary { background: #e8a93a; color: #1a1305; border: 0; font-weight: 600; }
  /* edge handle + menu */
  #handle { position: fixed; top: calc(var(--safe-t) + 2px); left: 50%; transform: translateX(-50%); width: 56px; height: 14px; border-radius: 0 0 10px 10px;
    background: rgba(255,255,255,.16); border: 0; padding: 0; z-index: 5; opacity: .5; }
  #handle::after { content: ""; display: block; width: 22px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.7); margin: 0 auto; }
  #menu { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.65); display: none; align-items: center; justify-content: center; }
  #menu.open { display: flex; }
  #menu .panel { background: #171922; border: 1px solid #2a2e3b; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 240px; }
  #menu h2 { margin: 0 0 4px; font-size: 16px; text-align: center; }
  #menu small { color: #8b90a3; text-align: center; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1f222d; border: 1px solid #2a2e3b; padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 12; display: none; }
</style>
</head>
<body>
<div class="center" id="status"><div id="statusText">Loading…</div></div>
<button id="handle" aria-label="Game menu" hidden></button>
<div id="menu">
  <div class="panel">
    <h2 id="menuTitle"></h2>
    <a class="btn" id="homeBtn" href="./">All games</a>
    <button class="btn" id="updateBtn" type="button">Check for update</button>
    <button class="btn" id="reloadBtn" type="button">Restart game</button>
    <button class="btn primary" id="resumeBtn" type="button">Resume</button>
    <small id="menuInfo"></small>
  </div>
</div>
<div id="toast"></div>

<script type="module">
import { loadGames, getRec, syncGame, registerSW, ago } from './lib.js';

const $ = id => document.getElementById(id);
const id = new URLSearchParams(location.search).get('game');
let game, frame, current;

registerSW();

function show(msg, err, extra) {
  const s = $('status'); s.style.display = 'flex';
  s.innerHTML = '';
  if (game && game.icon) { const i = document.createElement('img'); i.src = game.icon; s.appendChild(i); }
  const d = document.createElement('div'); d.textContent = msg; if (err) d.className = 'err'; s.appendChild(d);
  const row = document.createElement('div'); row.style.cssText = 'display:flex;gap:10px';
  if (err) {
    const retry = document.createElement('button'); retry.className = 'btn primary'; retry.textContent = 'Retry';
    retry.onclick = () => location.reload(); row.appendChild(retry);
    const home = document.createElement('a'); home.className = 'btn'; home.href = './'; home.textContent = 'All games';
    row.appendChild(home);
  }
  s.appendChild(row);
}

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 2800);
}

/* Per-game installability: point this page at the generated manifest + icon. */
function applyMeta(g) {
  document.title = g.title || g.id;
  const m = document.createElement('link'); m.rel = 'manifest'; m.href = 'manifest/' + encodeURIComponent(g.id) + '.webmanifest';
  document.head.appendChild(m);
  const icon = g.icon || 'icons/icon-512.png';
  for (const rel of ['icon', 'apple-touch-icon']) {
    const l = document.createElement('link'); l.rel = rel; l.href = icon; document.head.appendChild(l);
  }
  const t = document.createElement('meta'); t.name = 'apple-mobile-web-app-title'; t.content = g.shortName || g.title || g.id; document.head.appendChild(t);
  const c = document.querySelector('meta[name=theme-color]'); c.content = g.theme || g.background || '#0e0f13';
  document.body.style.background = g.background || '#0e0f13';
}

/* Each game gets its own namespaced localStorage so games don't trample each other's saves. */
function storageShim(gid) {
  return `<script>(function(){try{var P=${JSON.stringify('wg:' + gid + ':')},real=window.localStorage;
function mk(){var api={getItem:function(k){return real.getItem(P+k)},setItem:function(k,v){real.setItem(P+k,String(v))},
removeItem:function(k){real.removeItem(P+k)},clear:function(){for(var i=real.length-1;i>=0;i--){var k=real.key(i);if(k&&k.indexOf(P)===0)real.removeItem(k)}},
key:function(n){var a=[];for(var i=0;i<real.length;i++){var k=real.key(i);if(k&&k.indexOf(P)===0)a.push(k.slice(P.length))}return a[n]===undefined?null:a[n]}};
return new Proxy(api,{get:function(t,p){if(p==='length'){var n=0;for(var i=0;i<real.length;i++){var k=real.key(i);if(k&&k.indexOf(P)===0)n++}return n}
if(p in t)return t[p];if(typeof p==='string')return t.getItem(p)===null?undefined:t.getItem(p)},
set:function(t,p,v){t.setItem(p,v);return true},deleteProperty:function(t,p){t.removeItem(p);return true},
has:function(t,p){return p in t||t.getItem(p)!==null},
ownKeys:function(t){var a=[],n=t.length;for(var i=0;i<n;i++)a.push(t.key(i));return a},
getOwnPropertyDescriptor:function(t,p){if(typeof p==='string'&&t.getItem(p)!==null)return{value:t.getItem(p),writable:true,enumerable:true,configurable:true}}})}
var s=mk();Object.defineProperty(window,'localStorage',{configurable:true,get:function(){return s}})}catch(e){}})();<\/script>`;
}

function inject(html, gid) {
  const shim = storageShim(gid);
  let m;
  if ((m = /<head[^>]*>/i.exec(html))) return html.slice(0, m.index + m[0].length) + shim + html.slice(m.index + m[0].length);
  if ((m = /<html[^>]*>/i.exec(html))) return html.slice(0, m.index + m[0].length) + shim + html.slice(m.index + m[0].length);
  if ((m = /<!doctype[^>]*>/i.exec(html))) return html.slice(0, m.index + m[0].length) + shim + html.slice(m.index + m[0].length);
  return shim + html;
}

function launch(rec) {
  current = rec;
  if (frame) frame.remove();
  frame = document.createElement('iframe');
  frame.setAttribute('allow', 'autoplay; fullscreen; gamepad; accelerometer; gyroscope; clipboard-write');
  frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-pointer-lock allow-modals allow-popups allow-forms');
  frame.srcdoc = inject(rec.html, game.id);
  document.body.insertBefore(frame, $('handle'));
  $('status').style.display = 'none';
  $('handle').hidden = false;
  frame.addEventListener('load', () => { try { frame.contentWindow.focus(); } catch {} });
}

function openMenu() {
  $('menuInfo').textContent = current ? 'Downloaded ' + ago(current.fetchedAt) : '';
  $('menu').classList.add('open');
}
function closeMenu() { $('menu').classList.remove('open'); try { frame.contentWindow.focus(); } catch {} }

$('handle').addEventListener('click', openMenu);
$('resumeBtn').onclick = closeMenu;
$('menu').addEventListener('click', e => { if (e.target === $('menu')) closeMenu(); });
$('reloadBtn').onclick = () => { launch(current); closeMenu(); };
$('updateBtn').onclick = async () => {
  $('updateBtn').textContent = 'Checking…';
  try {
    const { status, rec } = await syncGame(game);
    if (status === 'updated') { $('updateBtn').textContent = 'Updated — restarting'; launch(rec); setTimeout(closeMenu, 400); }
    else $('updateBtn').textContent = status === 'offline' ? 'Offline' : 'Already up to date';
  } catch (e) { $('updateBtn').textContent = e.message; }
  setTimeout(() => $('updateBtn').textContent = 'Check for update', 3000);
};

(async function main() {
  if (!id) return show('No game selected.', true);
  try {
    const games = await loadGames();
    game = games.find(g => g.id === id);
  } catch (e) { return show(e.message, true); }
  if (!game) return show('Unknown game "' + id + '". Is it listed in games.json?', true);
  applyMeta(game);
  $('menuTitle').textContent = game.title || game.id;

  let rec = await getRec(game.id).catch(() => null);
  if (rec) {
    launch(rec);
    // Quietly look for a newer version; don't interrupt a game in progress.
    if (navigator.onLine) syncGame(game).then(r => {
      if (r.status === 'updated') toast('Update downloaded — restart the game from the menu to use it.');
    }).catch(() => {});
  } else {
    show('Downloading ' + (game.title || game.id) + '…');
    try { rec = (await syncGame(game)).rec; launch(rec); }
    catch (e) { show(e.message, true); }
  }
})();
</script>
</body>
</html>
